name: Setup
description: Setup Node.js, Bun, and install dependencies

inputs:
  install-example:
    description: Install example app dependencies
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash

    - name: Install example dependencies
      if: inputs.install-example == 'true'
      run: bun install --frozen-lockfile --cwd example
      shell: bash
