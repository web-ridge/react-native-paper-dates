name: Check for repro
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write

jobs:
  check-repro:
    if: contains(github.event.issue.labels.*.name, 'bug')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const user = context.payload.sender.login.replace(
              /[.*+?^${}()|[\]\\]/g,
              "\\$&"
            );
            const body = context.payload.comment
              ? context.payload.comment.body
              : context.payload.issue.body;
            const pattern = new RegExp(
              `https?:\\/\\/(?:github\\.com\\/${user}\\/[^\\s)\\]>]+|snack\\.expo\\.dev\\/\\S+)`,
              "i"
            );
            const issue = {
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            };
            if (pattern.test(body || "")) {
              await github.rest.issues.addLabels({
                ...issue,
                labels: ["repro provided"],
              });
              try {
                await github.rest.issues.removeLabel({
                  ...issue,
                  name: "needs repro",
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
              return;
            }
            if (context.eventName !== "issues") {
              return;
            }
            const comment = [
              "Hey! Thanks for opening the issue. The issue doesn't seem to contain a link to a repro (a [snack.expo.dev](https://snack.expo.dev) link or link to a GitHub repo under your username).",
              "",
              "Can you provide a [minimal repro](https://stackoverflow.com/help/minimal-reproducible-example) which demonstrates the issue? A repro will help us debug the issue faster. Please try to keep the repro as small as possible and make sure that we can run it without additional setup.",
            ].join("\n");
            const comments = await github.rest.issues.listComments({
              ...issue,
              per_page: 100,
            });
            if (comments.data.some((entry) => entry.body === comment)) {
              return;
            }
            await github.rest.issues.createComment({
              ...issue,
              body: comment,
            });
            await github.rest.issues.addLabels({
              ...issue,
              labels: ["needs repro"],
            });
